version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /apps/distribution
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /packages/core
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /packages/tokens
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /apps/mobile/android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
